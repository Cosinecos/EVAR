name: CI
on:
  push:
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -e .
      - run: python scripts/validate_dataset.py .
      - run: python scripts/evaluate.py --config configs/mock.yaml --split Easy --limit 3 --output-dir outputs/ci
